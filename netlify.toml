[build]
  publish = "."

# Редирект с /index.html на корень с сохранением параметров
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 200
  force = true

# Фоллбэк для всех остальных путей
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
    [headers.values]
      Content-Security-Policy = "frame-ancestors *;"
      X-Frame-Options = "ALLOWALL"
      Access-Control-Allow-Origin = "*"
