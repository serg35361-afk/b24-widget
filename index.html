<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виджет</title>
    <script src="//api.bitrix24.com/api/v1/"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .hidden-block { display: none; background: #f8f9fa; padding: 15px; border-radius: 6px; margin-top: 10px; }
        .visible { display: block; }
        .btn-save { background: #2067b0; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .field-group { margin-bottom: 10px; }
        .field-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .field-group input, .field-group select { width: 100%; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h3 style="color: #2067b0;">🧪 Синтетические материалы</h3>
    <div id="loading" style="color: #888;">Загрузка...</div>
    <div id="form" style="display: none;">
        <label><input type="checkbox" id="chk"> Используется синтетический материал</label>
        <div id="fields" class="hidden-block">
            <div class="field-group">
                <label>Вид материала:</label>
                <select id="mat"><option>Загрузка...</option></select>
            </div>
            <div class="field-group">
                <label>Цвет:</label>
                <input type="text" id="col">
            </div>
            <div class="field-group">
                <label>Содержание (%):</label>
                <input type="number" id="cont">
            </div>
        </div>
        <button class="btn-save" id="btn" onclick="save()">Сохранить в сделку</button>
        <span id="msg" style="margin-left: 10px;"></span>
    </div>
    <script>
        const C = { E: 2, U1: 'UF_CRM_1790252290', U2: 'UF_CRM_1790252367', U3: 'UF_CRM_1790252404', U4: 'UF_CRM_1790252433' };
        let id = null, list = {};
        BX24.init(() => {
            BX24.placement.resizeWindow(600, 400);
            const p = BX24.placement.get();
            if (p && p.id) { id = p.id; loadList(); }
            else { document.getElementById('loading').innerText = 'Ошибка: не найден ID сделки'; }
            document.getElementById('chk').onchange = toggle;
        });
        function loadList() {
            BX24.callMethod('crm.item.property.get', { entityTypeId: C.E, field: C.U2 }, r => {
                if (r.error()) return;
                const s = r.data().property.settings;
                if (s && s.LIST) list = s.LIST;
                fillSelect(); loadDeal();
            });
        }
        function fillSelect() {
            const s = document.getElementById('mat');
            s.innerHTML = '<option value="">-- Выберите --</option>';
            for (let [i, v] of Object.entries(list)) {
                let o = document.createElement('option'); o.value = i; o.textContent = v; s.appendChild(o);
            }
        }
        function toggle() {
            const c = document.getElementById('chk').checked;
            document.getElementById('fields').className = c ? 'hidden-block visible' : 'hidden-block';
            BX24.placement.resizeWindow(600, c ? 450 : 200);
        }
        function loadDeal() {
            BX24.callMethod('crm.item.get', { entityTypeId: C.E, id: id }, r => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('form').style.display = 'block';
                if (r.error()) return;
                const d = r.data().item;
                document.getElementById('chk').checked = (d[C.U1] == '1' || d[C.U1] == 1);
                document.getElementById('mat').value = d[C.U2] || '';
                document.getElementById('col').value = d[C.U3] || '';
                document.getElementById('cont').value = d[C.U4] || '';
                toggle();
            });
        }
        function save() {
            const b = document.getElementById('btn'); const m = document.getElementById('msg');
            b.disabled = true; b.innerText = 'Сохранение...';
            const c = document.getElementById('chk').checked;
            const f = { [C.U1]: c ? '1' : '0', [C.U2]: c ? document.getElementById('mat').value : '', [C.U3]: c ? document.getElementById('col').value : '', [C.U4]: c ? document.getElementById('cont').value : '' };
            BX24.callMethod('crm.item.update', { entityTypeId: C.E, id: id, fields: f }, r => {
                b.disabled = false; b.innerText = 'Сохранить в сделку';
                if (r.error()) { m.innerText = 'Ошибка: ' + r.error_description(); m.style.color = 'red'; }
                else { m.innerText = '✅ Сохранено!'; m.style.color = 'green'; setTimeout(() => m.innerText = '', 3000); }
            });
        }
    </script>
</body>
</html>
