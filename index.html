<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виджет</title>
    <script src="https://api.bitrix24.com/api/v1/"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; margin: 0; background: #fff; }
        .hidden-block { display: none; background: #f8f9fa; padding: 15px; border-radius: 6px; margin-top: 10px; border: 1px solid #eaebec; }
        .visible { display: block; }
        .btn-save { background: #2067b0; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .btn-save:hover { background: #18528f; }
        .field-group { margin-bottom: 12px; }
        .field-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #333; }
        .field-group input, .field-group select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        #debug { background: #f0f0f0; border: 1px solid #ccc; padding: 8px; font-size: 11px; color: #333; margin-top: 15px; border-radius: 4px; display: none; word-break: break-all; }
    </style>
</head>
<body>
    <h3 style="color: #2067b0; margin-top: 0;">🧪 Синтетические материалы</h3>
    <div id="loading" style="color: #888;">Загрузка данных сделки...</div>
    
    <div id="form" style="display: none;">
        <label style="cursor: pointer; font-weight: bold;">
            <input type="checkbox" id="chk"> Используется синтетический материал
        </label>
        
        <div id="fields" class="hidden-block">
            <div class="field-group">
                <label>Вид материала:</label>
                <select id="mat">
                    <option value="">-- Выберите --</option>
                    <option value="Полиэстер">Полиэстер</option>
                    <option value="Лавсан">Лавсан</option>
                    <option value="Микрофибра">Микрофибра</option>
                </select>
            </div>
            <div class="field-group">
                <label>Цвет:</label>
                <input type="text" id="col">
            </div>
            <div class="field-group">
                <label>Содержание (%):</label>
                <input type="number" id="cont">
            </div>
        </div>
        
        <div>
            <button class="btn-save" id="btn" onclick="save()">Сохранить в сделку</button>
            <span id="msg" style="margin-left: 10px; font-size: 13px;"></span>
        </div>
    </div>

    <div id="debug"></div>

    <script>
        const C = { 
            U1: 'UF_CRM_1790252290', 
            U2: 'UF_CRM_1790252367', 
            U3: 'UF_CRM_1790252404', 
            U4: 'UF_CRM_1790252433' 
        };
        let dealId = null;

        function logDebug(msg) {
            const dbg = document.getElementById('debug');
            dbg.style.display = 'block';
            dbg.innerHTML += `<div>> ${msg}</div>`;
        }

        function safeResize(w, h) {
            // Проверяем наличие метода перед вызовом, чтобы избежать Uncaught TypeError
            if (typeof BX24 !== 'undefined' && BX24.placement && typeof BX24.placement.resizeWindow === 'function') {
                BX24.placement.resizeWindow(w, h);
            }
        }

        function getDealId() {
            try {
                const info = BX24.placement.info();
                if (info && info.options && info.options.ID) {
                    return info.options.ID;
                }
            } catch (e) {}

            const urlParams = new URLSearchParams(window.location.search);
            const pOpt = urlParams.get('PLACEMENT_OPTIONS');
            if (pOpt) {
                try {
                    const parsed = JSON.parse(pOpt);
                    if (parsed.ID || parsed.id) return parsed.ID || parsed.id;
                } catch (e) {}
            }
            return urlParams.get('id') || urlParams.get('ID');
        }

        if (typeof BX24 !== 'undefined') {
            BX24.init(() => {
                safeResize(600, 450);
                
                dealId = getDealId();
                logDebug('ID сделки: ' + dealId);

                if (dealId) { 
                    loadDeal(); 
                } else { 
                    document.getElementById('loading').innerText = 'Ошибка: не найден ID сделки'; 
                }

                document.getElementById('chk').onchange = toggle;
            });
        } else {
            document.getElementById('loading').innerText = 'Ошибка: библиотека BX24 не загружена.';
        }

        function toggle() {
            const c = document.getElementById('chk').checked;
            document.getElementById('fields').className = c ? 'hidden-block visible' : 'hidden-block';
            safeResize(600, c ? 450 : 200);
        }

        function loadDeal() {
            BX24.callMethod('crm.deal.get', { id: dealId }, r => {
                if (r.error()) {
                    document.getElementById('loading').innerText = 'Ошибка API: ' + r.error_description();
                    logDebug('Ошибка crm.deal.get: ' + JSON.stringify(r.error()));
                    return;
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('form').style.display = 'block';

                const d = r.data();
                document.getElementById('chk').checked = (d[C.U1] == '1' || d[C.U1] == 1 || d[C.U1] === true);
                document.getElementById('mat').value = d[C.U2] || '';
                document.getElementById('col').value = d[C.U3] || '';
                document.getElementById('cont').value = d[C.U4] || '';
                
                toggle();
            });
        }

        function save() {
            const b = document.getElementById('btn'); 
            const m = document.getElementById('msg');
            
            b.disabled = true; 
            b.innerText = 'Сохранение...';
            m.innerText = '';

            const c = document.getElementById('chk').checked;
            const fields = { 
                [C.U1]: c ? '1' : '0', 
                [C.U2]: c ? document.getElementById('mat').value : '', 
                [C.U3]: c ? document.getElementById('col').value : '', 
                [C.U4]: c ? document.getElementById('cont').value : '' 
            };

            BX24.callMethod('crm.deal.update', { id: dealId, fields: fields }, r => {
                b.disabled = false; 
                b.innerText = 'Сохранить в сделку';

                if (r.error()) { 
                    m.innerText = 'Ошибка: ' + r.error_description(); 
                    m.style.color = 'red'; 
                } else { 
                    m.innerText = '✅ Сохранено!'; 
                    m.style.color = 'green'; 
                    setTimeout(() => m.innerText = '', 3000); 
                }
            });
        }
    </script>
</body>
</html>
