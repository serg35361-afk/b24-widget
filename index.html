<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виджет</title>
    <script src="https://api.bitrix24.com/api/v1/"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; margin: 0; }
        .hidden-block { display: none; background: #f8f9fa; padding: 15px; border-radius: 6px; margin-top: 10px; }
        .visible { display: block; }
        .btn-save { background: #2067b0; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .field-group { margin-bottom: 10px; }
        .field-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .field-group input, .field-group select { width: 100%; padding: 8px; box-sizing: border-box; }
        #debug { background: #eee; padding: 8px; font-size: 11px; color: #333; margin-top: 15px; border-radius: 4px; display: none; }
    </style>
</head>
<body>
    <h3 style="color: #2067b0; margin-top: 0;">🧪 Синтетические материалы</h3>
    <div id="loading" style="color: #888;">Загрузка данных Битрикс24...</div>
    
    <div id="form" style="display: none;">
        <label><input type="checkbox" id="chk"> Используется синтетический материал</label>
        <div id="fields" class="hidden-block">
            <div class="field-group">
                <label>Вид материала:</label>
                <select id="mat">
                    <option value="">-- Выберите --</option>
                    <option value="Полиэстер">Полиэстер</option>
                    <option value="Лавсан">Лавсан</option>
                    <option value="Микрофибра">Микрофибра</option>
                </select>
            </div>
            <div class="field-group">
                <label>Цвет:</label>
                <input type="text" id="col">
            </div>
            <div class="field-group">
                <label>Содержание (%):</label>
                <input type="number" id="cont">
            </div>
        </div>
        <button class="btn-save" id="btn" onclick="save()">Сохранить в сделку</button>
        <span id="msg" style="margin-left: 10px;"></span>
    </div>

    <div id="debug"></div>

    <script>
        const C = { 
            E: 2, // entityTypeId: 2 (Сделка)
            U1: 'UF_CRM_1790252290', 
            U2: 'UF_CRM_1790252367', 
            U3: 'UF_CRM_1790252404', 
            U4: 'UF_CRM_1790252433' 
        };
        let id = null;

        function logDebug(msg) {
            const dbg = document.getElementById('debug');
            dbg.style.display = 'block';
            dbg.innerHTML += `<div>> ${msg}</div>`;
        }

        function getPlacementOptions() {
            try {
                const placementInfo = BX24.placement.info();
                logDebug('Placement info: ' + JSON.stringify(placementInfo));
                if (placementInfo && placementInfo.options && placementInfo.options.ID) {
                    return placementInfo.options.ID;
                }
            } catch (e) {
                logDebug('Placement info error: ' + e.message);
            }

            const urlParams = new URLSearchParams(window.location.search);
            const placementOptions = urlParams.get('PLACEMENT_OPTIONS');
            logDebug('URL PLACEMENT_OPTIONS: ' + placementOptions);

            if (placementOptions) {
                try {
                    const parsed = JSON.parse(placementOptions);
                    return parsed.ID || parsed.id;
                } catch (e) {}
            }
            return urlParams.get('id') || urlParams.get('ID');
        }

        if (typeof BX24 !== 'undefined') {
            BX24.init(() => {
                logDebug('BX24.init успешно вызван');
                BX24.placement.resizeWindow(600, 450);
                
                id = getPlacementOptions();
                logDebug('Полученный ID сделки: ' + id);

                if (id) { 
                    loadDeal(); 
                } else { 
                    document.getElementById('loading').innerText = 'Ошибка: не найден ID сделки'; 
                }

                document.getElementById('chk').onchange = toggle;
            });
        } else {
            document.getElementById('loading').innerText = 'Ошибка: библиотека BX24 не загружена.';
        }

        function toggle() {
            const c = document.getElementById('chk').checked;
            document.getElementById('fields').className = c ? 'hidden-block visible' : 'hidden-block';
            BX24.placement.resizeWindow(600, c ? 450 : 200);
        }

        function loadDeal() {
            BX24.callMethod('crm.item.get', { entityTypeId: C.E, id: id }, r => {
                if (r.error()) {
                    document.getElementById('loading').innerText = 'Ошибка API Битрикс24: ' + r.error_description();
                    logDebug('API Error: ' + JSON.stringify(r.error()));
                    return;
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('form').style.display = 'block';

                const d = r.data().item;
                document.getElementById('chk').checked = (d[C.U1] == '1' || d[C.U1] == 1 || d[C.U1] === true);
                document.getElementById('mat').value = d[C.U2] || '';
                document.getElementById('col').value = d[C.U3] || '';
                document.getElementById('cont').value = d[C.U4] || '';
                
                toggle();
            });
        }

        function save() {
            const b = document.getElementById('btn'); 
            const m = document.getElementById('msg');
            
            b.disabled = true; 
            b.innerText = 'Сохранение...';
            m.innerText = '';

            const c = document.getElementById('chk').checked;
            const f = { 
                [C.U1]: c ? '1' : '0', 
                [C.U2]: c ? document.getElementById('mat').value : '', 
                [C.U3]: c ? document.getElementById('col').value : '', 
                [C.U4]: c ? document.getElementById('cont').value : '' 
            };

            BX24.callMethod('crm.item.update', { entityTypeId: C.E, id: id, fields: f }, r => {
                b.disabled = false; 
                b.innerText = 'Сохранить в сделку';

                if (r.error()) { 
                    m.innerText = 'Ошибка: ' + r.error_description(); 
                    m.style.color = 'red'; 
                } else { 
                    m.innerText = '✅ Сохранено!'; 
                    m.style.color = 'green'; 
                    setTimeout(() => m.innerText = '', 3000); 
                }
            });
        }
    </script>
</body>
</html>
